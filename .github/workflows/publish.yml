name: Publish to npm with Provenance

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install TypeScript
        run: npm install --no-save typescript@5.7.3 @types/node

      - name: Build package
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
